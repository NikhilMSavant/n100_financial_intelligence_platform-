metrics:
  roe_min: {column: return_on_equity_pct, direction: min}
  de_max: {column: debt_to_equity, direction: max}
  fcf_min: {column: free_cash_flow_cr, direction: min}
  revenue_cagr_5yr_min: {column: revenue_cagr_5yr, direction: min}
  pat_cagr_5yr_min: {column: pat_cagr_5yr, direction: min}
  opm_min: {column: operating_profit_margin_pct, direction: min}
  pe_max: {column: pe_ratio, direction: max}
  pb_max: {column: pb_ratio, direction: max}
  dividend_yield_min: {column: dividend_yield_pct, direction: min}
  icr_min: {column: interest_coverage, direction: min, infinite_when_null_label: "Debt Free"}
  market_cap_min: {column: market_cap_crore, direction: min}
  net_profit_min: {column: net_profit, direction: min}
  eps_cagr_min: {column: eps_cagr_5yr, direction: min}
  asset_turnover_min: {column: asset_turnover, direction: min}
  sales_min: {column: sales, direction: min}

presets:
  quality_compounder:
    label: "Quality Compounder"
    filters: {roe_min: 15, de_max: 1.0, fcf_min: 0, revenue_cagr_5yr_min: 10}
  value_pick:
    label: "Value Pick"
    # Thresholds calibrated to this dataset's actual PE/PB distribution (median PE ~44,
    # median PB ~7.5) rather than the textbook PE<20/PB<3, which returned only 2 of 92
    # companies on this universe -- see Sprint 3 retrospective.
    filters: {pe_max: 35, pb_max: 6.0, de_max: 2.0, dividend_yield_min: 1}
  growth_accelerator:
    label: "Growth Accelerator"
    filters: {pat_cagr_5yr_min: 20, revenue_cagr_5yr_min: 15, de_max: 2.0}
  dividend_champion:
    label: "Dividend Champion"
    filters: {dividend_yield_min: 2, dividend_payout_max: 80, fcf_min: 0}
  debt_free_blue_chip:
    label: "Debt-Free Blue Chip"
    filters: {de_max: 0, roe_min: 12, sales_min: 5000}
  turnaround_watch:
    label: "Turnaround Watch"
    filters: {revenue_cagr_3yr_min: 10, fcf_min: 0, de_declining_yoy: true}

composite_score_weights:
  profitability: 0.35   # roe 0.15 + roce 0.10 + npm 0.10
  cash_quality: 0.30    # fcf_cagr 0.15 + cfo_pat 0.10 + fcf_positive_flag 0.05
  growth: 0.20          # revenue_cagr 0.10 + pat_cagr 0.10
  leverage: 0.15        # de_score 0.10 + icr_score 0.05

winsorize_pctile: [10, 90]
