presets:
  quality_compounder:
    label: "Quality Compounder"
    filters:
      return_on_equity_pct: {min: 15}
      debt_to_equity: {max: 1.0}
      free_cash_flow_cr: {min: 0}
      revenue_cagr_5yr: {min: 10}
    rank_by: composite_quality_score
    expected_range: [15, 50]

  value_pick:
    label: "Value Pick"
    filters:
      pe_ratio: {max: 20}
      pb_ratio: {max: 3.0}
      debt_to_equity: {max: 2.0}
      dividend_yield_pct: {min: 1}
    rank_by: fcf_yield_pct
    expected_range: [10, 25]

  growth_accelerator:
    label: "Growth Accelerator"
    filters:
      pat_cagr_5yr: {min: 20}
      revenue_cagr_5yr: {min: 15}
      debt_to_equity: {max: 2.0}
    rank_by: pat_cagr_5yr
    expected_range: [8, 20]

  dividend_champion:
    label: "Dividend Champion"
    filters:
      dividend_yield_pct: {min: 2}
      dividend_payout_ratio_pct: {max: 80}
      free_cash_flow_cr: {min: 0}
    rank_by: dividend_yield_pct
    expected_range: [10, 20]

  debt_free_blue_chip:
    label: "Debt-Free Blue Chip"
    filters:
      debt_to_equity: {equals: 0}
      return_on_equity_pct: {min: 12}
      sales: {min: 5000}
    rank_by: return_on_equity_pct
    expected_range: [15, 30]

  turnaround_watch:
    label: "Turnaround Watch"
    filters:
      revenue_cagr_3yr: {min: 10}
      free_cash_flow_cr: {min: 0}
      # D/E declining YoY handled programmatically in engine.py
    rank_by: revenue_cagr_3yr
    expected_range: [5, 15]

filterable_metrics:
  - return_on_equity_pct
  - debt_to_equity
  - free_cash_flow_cr
  - revenue_cagr_5yr
  - pat_cagr_5yr
  - operating_profit_margin_pct
  - pe_ratio
  - pb_ratio
  - dividend_yield_pct
  - interest_coverage
  - market_cap_crore
  - net_profit
  - eps_cagr_5yr
  - asset_turnover
  - sales

de_filter_skip_sector: "Financials"
icr_debtfree_treated_as: .inf
